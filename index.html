<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页交互术语图鉴</title>
    <meta
      name="description"
      content="看得见、点得动的网页交互术语词典：每个术语都配可操作的实例、大白话解释和可直接复制的 AI 提示词。"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
    />
    <!-- 简体 → 繁体 转换（加载失败时仅禁用繁体切换，不影响其他功能） -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
    <style>
      summary::-webkit-details-marker {
        display: none;
      }
      /* 实例用到的少量自定义动画 */
      @keyframes wig-marquee {
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes wig-ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .wig-noscrollbar {
        scrollbar-width: none;
      }
      .wig-noscrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-700 antialiased">
    <div id="app"></div>
    <div
      id="tip"
      class="pointer-events-none fixed bottom-6 left-1/2 z-[60] -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2 text-sm text-white opacity-0 shadow-lg transition-opacity duration-300"
    ></div>

    <script src="js/helpers.js"></script>
    <script src="js/terms-basic.js"></script>
    <script src="js/terms-more-1.js"></script>
    <script src="js/terms-more-2.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
